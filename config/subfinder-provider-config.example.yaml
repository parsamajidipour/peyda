# Copy this file to your local subfinder provider config path and add your own keys.
# Do not commit real API keys.
#
# Common path:
#   ~/.config/subfinder/provider-config.yaml
#
# See:
#   https://docs.projectdiscovery.io/tools/subfinder/install#post-install-configuration

binaryedge:
  - YOUR_BINARYEDGE_API_KEY

censys:
  - YOUR_CENSYS_API_ID:YOUR_CENSYS_API_SECRET

chaos:
  - YOUR_CHAOS_API_KEY

fofa:
  - YOUR_FOFA_EMAIL:YOUR_FOFA_KEY

github:
  - YOUR_GITHUB_TOKEN

securitytrails:
  - YOUR_SECURITYTRAILS_API_KEY

shodan:
  - YOUR_SHODAN_API_KEY

virustotal:
  - YOUR_VIRUSTOTAL_API_KEY
