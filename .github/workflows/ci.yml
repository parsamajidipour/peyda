name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go-and-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test Go packages
        run: go test ./...

      - name: Build CLI
        run: go build -o bin/peyda ./cmd/peyda

      - name: Check shell syntax
        run: if compgen -G "scripts/*.sh" > /dev/null; then bash -n scripts/*.sh; fi
